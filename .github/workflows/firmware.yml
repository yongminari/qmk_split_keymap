name: Build and release QMK firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build firmware
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: 0.33.13

  publish:
    name: Publish versioned release
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout userspace
        uses: actions/checkout@v6

      - name: Validate release version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION ($version) is not a valid MAJOR.MINOR.PATCH version." >&2
            exit 1
          fi
          if [[ "$version" != "$tag_version" ]]; then
            echo "VERSION ($version) does not match tag ($GITHUB_REF_NAME)." >&2
            exit 1
          fi

      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: Firmware
          path: dist

      - name: Build release package
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          firmware="dist/crkbd_rev4_1_standard_yongminari.uf2"
          package_dir="corne-firmware-v${version}"

          test -f "$firmware"
          mkdir "$package_dir"
          install -m 0644 "$firmware" "$package_dir/"
          install -m 0755 flash.sh "$package_dir/"
          install -m 0644 VERSION release/FLASHING.md "$package_dir/"
          tar -czf "dist/${package_dir}-linux.tar.gz" "$package_dir"
          mv "$firmware" "dist/corne-firmware-v${version}.uf2"

          cd dist
          sha256sum *.uf2 *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.uf2 \
            dist/*.tar.gz \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "Corne firmware $GITHUB_REF_NAME" \
            --generate-notes \
            --latest
